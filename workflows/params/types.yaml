    dryRun: {type: boolean}
    timeoutSeconds: {type: posint}
    prTimeoutSeconds: {type: posint}
    toolsImage: {type: string}

rules:
  tpg-day0: &instanceRules
    - when: {highAvailability: "true", readReplicas: "0+"}
      message: "highAvailability=true needs readReplicas 1 or more (a single node is highAvailability=false)"
    - when: {highAvailability: "false", readReplicas: "0*[1-9][0-9]*"}
      message: "readReplicas above 0 needs highAvailability=true (a single node has no read replicas)"
    - when: {highAvailability: "false", ferretReadOnlyReplicas: "0*[1-9][0-9]*"}
      message: "ferretReadOnlyReplicas above 0 needs highAvailability=true (the read-only FerretDB proxies connect to the standby)"
  tpg-create-instance: *instanceRules
