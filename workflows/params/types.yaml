# Input parameter types of every tpg WorkflowTemplate.
#
# Argo Workflows has no parameter types (a parameter is a string, with an
# optional enum), so the types are declared here once and enforced before a
# Workflow exists: workflows/params/generate.py turns this file into the
# ValidatingAdmissionPolicy workflows/admission/workflow-parameters.yaml. The
# Kubernetes API server of the hub then rejects a Workflow of a tpg template
# whose inputs do not match - from argo submit, the Argo UI, the API or a
# CronWorkflow - with a message that names each wrong input and its type, and
# no Workflow is created.
#
# tests/params/run.sh checks that this file, the WorkflowTemplates (names,
# defaults, enums), the generated policy and the Type columns in
# docs/workflow-commands.md agree.
#
# Mandatory inputs are still checked by the validate step of each workflow,
# because some are mandatory only without clusterMap; so is the inside of
# clusterMap (clustermap.py), which CEL cannot parse.
#
#   type        a key of "types" below
#   values      enum only
#   allowEmpty  true: an empty value passes the type check (optional inputs, and
#               mandatory ones whose absence the validate step reports)
#
# rules (after templates): combinations of inputs that are refused together.
# A rule fires when every input it names is passed and matches its regular
# expression (full match); inputs left at their default are not checked here
# (the validate step checks the effective values, clusterMap included).
types:
  string: {display: String, pattern: "", describe: "a string"}
  name: {display: String (name), pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', describe: "a lowercase DNS label"}
  azureName: {display: String (Azure name), pattern: '^[A-Za-z0-9]([-A-Za-z0-9_.]{0,78}[A-Za-z0-9_])?$', describe: "an Azure resource name (letters, digits, hyphen, underscore, period; at most 80 characters)"}
  k8sName: {display: String (name), pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$', describe: "a Kubernetes object name"}
  list: {display: List, pattern: '^\s*[a-z0-9]([-a-z0-9]*[a-z0-9])?(\s*,\s*[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\s*$', describe: "a List (comma-separated names)", excludeAll: true}
  listOrAll: {display: List, pattern: '^\s*(all|[a-z0-9]([-a-z0-9]*[a-z0-9])?(\s*,\s*[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)\s*$', describe: "a List (comma-separated names, or all)"}
  components: {display: List, pattern: '^\s*(auto|cert-manager|vso|monitoring)(\s*,\s*(cert-manager|vso|monitoring))*\s*$', describe: "a List of auto, cert-manager, vso, monitoring"}
  boolean: {display: Boolean, pattern: '^(true|false)$', describe: "a Boolean (true or false)"}
  integer: {display: Integer, pattern: '^[0-9]+$', describe: "an Integer (0 or more)"}
  posint: {display: Integer, pattern: '^[1-9][0-9]*$', describe: "an Integer (1 or more)"}
  quantity: {display: String (quantity), pattern: '^[0-9]+(\.[0-9]+)?(m|Ki|Mi|Gi|Ti|Pi|k|M|G|T|P)?$', describe: "a Kubernetes quantity such as 20Gi or 500m"}
  enum: {display: Enum, pattern: "", describe: "one of"}
  operatorVersion: {display: String (version), pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$', describe: "an operator version such as v4.5.0"}
  postgresVersion: {display: String (version), pattern: '^(postgres-)?[0-9]+(\.[0-9]+)?$', describe: "a Postgres version such as postgres-17.6"}
  version: {display: String (version), pattern: '^(v?[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?|(postgres-)?[0-9]+(\.[0-9]+)?)$', describe: "an operator version (v4.5.1) or a Postgres version (postgres-17.6)"}
  timestamp: {display: String (UTC time), pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$', describe: "a UTC time such as 2026-09-15T08:30:00Z"}
  lsn: {display: String (LSN), pattern: '^[0-9A-Fa-f]+/[0-9A-Fa-f]+$', describe: "a log sequence number such as 0/3000060"}
  map: {display: Map, pattern: '^\s*(\{|[^\s:#][^:]*:)', describe: "a Map (YAML or JSON)"}
  jsonMap: {display: Map (JSON), pattern: '^\s*\{', describe: "a JSON object"}
  cidrList: {display: List (CIDRs), pattern: '^\s*[0-9A-Fa-f:.]+/[0-9]{1,3}(\s*,\s*[0-9A-Fa-f:.]+/[0-9]{1,3})*\s*$', describe: "a List of CIDRs such as 10.20.0.0/16"}
  fqdnList: {display: List (host names), pattern: '^\s*(\*\.)?[a-z0-9.-]+\.[a-z]{2,}(\s*,\s*(\*\.)?[a-z0-9.-]+\.[a-z]{2,})*\s*$', describe: "a List of host names such as db.example.com or *.example.com"}
  cron: {display: String (cron), pattern: '^\s*[0-9*/,A-Za-z-]+(\s+[0-9*/,A-Za-z-]+){4}\s*$', describe: "a cron schedule of 5 fields such as 0 0 * * 0"}
  patchFile: {display: String (file path), pattern: '^(\./)*([A-Za-z0-9_][A-Za-z0-9_.-]*/)*[A-Za-z0-9_][A-Za-z0-9_.-]*\.ya?ml$', describe: "the relative path of one .yaml or .yml file"}

