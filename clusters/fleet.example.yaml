# Example of a filled-in clusters/fleet.yaml (not read by Argo CD or the
# workflows). tpg-day0 and tpg-create-instance write these entries; tpg-patch
# records the patch files (current, and the previous one with the commit that
# added it; Round 14); tpg-network-policy writes network.
# See clusters/fleet.yaml for the layout.
clusters:
  aks-tpg-poc-01:
    operator:
      version: v4.5.0
      patches:
        values:
          current: patches/operator/example-operator-values-ex4m3.yaml
    instances:
      orders-db:
        instance:
          postgresVersion: postgres-17.6
          highAvailability:
            enabled: true
            readReplicas: 1
        patches:
          postgres:
            current: patches/example-postgres-resources-ex4m1.yaml
      billing-db:
        instance:
          postgresVersion: postgres-17.6
          highAvailability:
            enabled: false
            readReplicas: 0
        backup:
          scheduled: false
  aks-tpg-poc-02:
    operator:
      version: v4.5.0
    instances:
      orders-db:
        instance:
          postgresVersion: postgres-17.6
          storageSize: 50Gi
          # tpg-day0 / tpg-create-instance input exposure (design decision D64)
          exposure: internalLoadBalancer
          allowedSourceRanges:
            - 10.20.0.0/16
        # tpg-network-policy, or the networkPolicy input (design decision D65)
        network:
          policy: baseline
          acns: false
          ingressFromNamespaces:
            - orders-app
        patches:
          values:
            current: patches/example-values-backup-ex4m2.yaml
            previous:
              path: patches/example-values-retention-ex4m0.yaml
              commit: 4f2c1e9a7b3d5c8e0f1a2b3c4d5e6f7a8b9c0d1e
