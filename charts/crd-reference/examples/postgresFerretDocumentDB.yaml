# Example for charts/crd-reference (the 4.5 documentation sample, adapted to the
# fleet names). Render it with:
#   helm template ref charts/crd-reference -f charts/crd-reference/examples/postgresFerretDocumentDB.yaml
postgresFerretDocumentDB:
  enabled: true
  name: orders-db
  spec:
    readWrite: {replicas: 1}
    postgres:
      connectionDetails:
        readWrite: {secretName: orders-db-app-user-db-secret}
    service: {serviceType: ClusterIP}
